# ============================================================
# SIMONPOKJA — Konfigurasi NGINX (produksi)
# ============================================================
# Web root  : /var/www/simonpokja/public
# Catatan   : blok "try_files" di bawah memastikan SEMUA
#             permintaan — termasuk API (/api/v1/*) — diarahkan
#             ke public/index.php, sehingga struktur & base URL
#             API tetap bekerja persis seperti di development.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name simonpokja.banjarnegarakab.go.id;

    # Wajib sama dengan folder tempat proyek di-deploy
    root /var/www/simonpokja/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    # Gzip dasar
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Redirect HTTP -> HTTPS (aktifkan setelah SSL terpasang)
    # return 301 https://$host$request_uri;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Blokir akses langsung ke file sensitif
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Tangani file statis + symlink /storage (untuk upload)
    location ~* \.(?:jpg|jpeg|png|gif|ico|css|js|pdf|svg)$ {
        expires 30d;
        try_files $uri /index.php?$query_string;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock; # sesuaikan versi/socket PHP-FPM
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Jalankan sebagai user sistem (bukan www-data bila VPS custom)
        fastcgi_param PHP_VALUE "upload_max_filesize=20M \n post_max_size=21M";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}